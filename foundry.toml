[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.27"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

auto_detect_remappings = true 
via_ir = false

[profile.production]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 1000000
via_ir = false
bytecode_hash = "none"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50

[fmt]
line_length = 120
tab_width = 4
style = "space"
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}" } 

[profile.fork]
evm_version = "cancun"