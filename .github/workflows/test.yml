name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build --sizes

      - name: Run non-fork tests
        run: forge test --no-match-path "test/fork/*" -vv

      - name: Run fork tests (optional, needs secrets)
        if: ${{ env.SEPOLIA_RPC_URL != '' }}
        run: forge test --match-path "test/fork/*" -vv